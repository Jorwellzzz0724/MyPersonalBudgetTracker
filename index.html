<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>MY BUDGET TRACKER</title>
<style>
html,body{margin:0;height:100%;background:#0b1020;color:#e5e7eb;font-family:system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b1020}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#boot h1{margin:0;font-size:20px;letter-spacing:.18em}
#bm{font-size:14px;color:#94a3b8;max-width:340px}#bm.bad{color:#f87171}
#bb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{border:0;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;background:#818cf8;color:#0b1020}button.g{background:#1e293b;color:#e5e7eb}
#upd{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2147483000;align-items:center;justify-content:space-between;gap:10px;background:#1e293b;color:#e5e7eb;border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.45);font-size:14px}
</style></head><body>
<div id="boot"><h1>MY BUDGET TRACKER</h1><div id="bm">Loading…</div><div id="bb"></div></div>
<iframe id="app" hidden title="My Budget Tracker"></iframe>
<div id="upd"><span>✨ Update ready</span><button onclick="btApplyUpdate()">Reload now</button></div>
<script>
/* Bridge: makes google.script.run work outside Apps Script by sending each call to your Apps Script web app (Api.gs).
   The rest of the app is unchanged. Your Google Sheet stays the database. */
(function () {
  var LS = 'bt_api_v1';
  var DEFAULT_URL = '';   // optional: paste your Web app URL (ends in /exec) here. Leave empty to be asked on first open.
  function cfg() { try { return JSON.parse(localStorage.getItem(LS) || 'null') || {}; } catch (e) { return {}; } }
  function save(c) { try { localStorage.setItem(LS, JSON.stringify(c)); } catch (e) {} }
  try { if (/[?&]reset\b/.test(location.search)) localStorage.removeItem(LS); } catch (e) {}   // open the page with ?reset=1 to enter the URL and passcode again
  var pending = null;

  function ask(c) {
    return new Promise(function (resolve) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(2,6,23,.72);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif';
      d.innerHTML = '<div style="background:#fff;color:#0f172a;border-radius:14px;padding:18px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.4)">' +
        '<h3 style="margin:0 0 6px">Connect to your Google Sheet</h3>' +
        '<p style="margin:0 0 10px;font-size:13px;color:#475569">Enter this once. It is saved only on this phone.</p>' +
        '<label style="font-size:12px;font-weight:600">Web app URL (ends in /exec)</label>' +
        '<input id="bt_u" type="url" autocomplete="off" style="width:100%;box-sizing:border-box;margin:4px 0 10px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px">' +
        '<label style="font-size:12px;font-weight:600">Passcode (API_KEY)</label>' +
        '<input id="bt_k" type="password" autocomplete="off" style="width:100%;box-sizing:border-box;margin:4px 0 6px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px">' +
        '<div id="bt_m" style="color:#b91c1c;font-size:12px;min-height:16px"></div>' +
        '<button id="bt_s" style="width:100%;padding:11px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-weight:600;font-size:15px">Save and connect</button></div>';
      document.body.appendChild(d);
      var u = d.querySelector('#bt_u'), k = d.querySelector('#bt_k'), m = d.querySelector('#bt_m');
      u.value = c.url || DEFAULT_URL || '';
      d.querySelector('#bt_s').onclick = function () {
        var url = u.value.trim(), key = k.value.trim();
        if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)) { m.textContent = 'The URL must start with https://script.google.com and end with /exec'; return; }
        if (!key) { m.textContent = 'Enter your passcode'; return; }
        var n = { url: url, key: key }; save(n); d.remove(); resolve(n);
      };
    });
  }

  function creds() {
    var c = cfg(); if (!c.url && DEFAULT_URL) c.url = DEFAULT_URL;
    if (c.url && c.key) return Promise.resolve(c);
    if (!pending) pending = ask(c).then(function (n) { pending = null; return n; });
    return pending;
  }

  function call(fn, args) {
    return creds().then(function (c) {
      return fetch(c.url, {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // text/plain avoids the browser pre-flight that Apps Script cannot answer
        body: JSON.stringify({ key: c.key, fn: fn, args: args })
      }).catch(function () { throw new Error('Cannot reach Apps Script. Check your internet and the Web app URL (open the page with ?reset=1 to enter it again).'); });
    }).then(function (r) {
      return r.json().catch(function () { save({}); throw new Error('Bad reply from Apps Script, so the saved URL was cleared. Reload and enter the /exec URL again (deployment: Execute as Me, access Anyone).'); });
    }).then(function (j) {
      if (j && j.ok) return j.data;
      var e = new Error((j && j.error) || 'Request failed');
      if (e.message === 'Unauthorized') { var c = cfg(); delete c.key; save(c); e.message = 'Wrong passcode. Reload the app and enter it again.'; }
      throw e;
    });
  }

  function make(s, f, u) {
    return new Proxy({}, {
      get: function (_, name) {
        if (typeof name !== 'string' || name === 'then') return undefined;
        if (name === 'withSuccessHandler') return function (h) { return make(h, f, u); };
        if (name === 'withFailureHandler') return function (h) { return make(s, h, u); };
        if (name === 'withUserObject') return function (o) { return make(s, f, o); };
        return function () {
          var a = Array.prototype.slice.call(arguments);
          call(name, a).then(
            function (d) { if (s) s(d, u); },
            function (e) { if (f) f(e, u); else console.error(name, e); }
          );
        };
      }
    });
  }
  window.google = { script: { run: make(null, null, null) } };
})();
</script>
<script>
(function () {
  function $(i) { return document.getElementById(i); }
  function idb() { return new Promise(function (res, rej) { var r = indexedDB.open('bt_loader', 1); r.onupgradeneeded = function () { r.result.createObjectStore('kv'); }; r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; }); }
  function kvGet(k) { return idb().then(function (db) { return new Promise(function (res, rej) { var q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { rej(q.error); }; }); }).catch(function () { return null; }); }
  function kvSet(k, v) { return idb().then(function (db) { return new Promise(function (res, rej) { var t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = function () { rej(t.error); }; }); }).catch(function () {}); }
  function kvDel(k) { return idb().then(function (db) { return new Promise(function (res) { var t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); }).catch(function () {}); }

  var pending = null;

  // The app is shown inside a full-screen frame. It uses the same google.script.run bridge as this page.
  function prep(html) {
    html = html.replace(/<base[^>]*>/i, '');
    var boot = '<script>window.google=parent.google;<\/script>';
    return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + boot; }) : boot + html;
  }
  function mount(html) { var f = $('app'); f.srcdoc = prep(html); f.hidden = false; $('boot').style.display = 'none'; }
  function fetchApp(have) { return new Promise(function (res, rej) { google.script.run.withSuccessHandler(res).withFailureHandler(rej).getApp(have || ''); }); }

  function showErr(e) {
    var m = String((e && e.message) || e);
    if (/Unknown function: getApp/.test(m)) m = 'Your Api.gs is not updated yet. Paste the new Api.gs, then Deploy > Manage deployments > New version.';
    $('bm').textContent = m; $('bm').className = 'bad';
    $('bb').innerHTML = '<button onclick="location.reload()">Try again</button><button class="g" onclick="location.href=location.pathname+\'?reset=1\'">Change URL / passcode</button>';
  }
  function showUpd() { $('upd').style.display = 'flex'; }
  window.btApplyUpdate = function () { if (!pending) return; $('app').srcdoc = prep(pending.html); pending = null; $('upd').style.display = 'none'; };

  var reset = /[?&]reset\b/.test(location.search);
  (reset ? kvDel('app') : Promise.resolve()).then(function () {
    if (reset) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
    return kvGet('app');
  }).then(function (c) {
    if (c && c.html) {
      mount(c.html);                                   // fast start: show the saved copy straight away
      fetchApp(c.v).then(function (r) {                // then quietly ask Apps Script if there is a newer one
        if (r.same) return;
        return kvSet('app', { v: r.v, html: r.html }).then(function () { pending = r; showUpd(); });
      }).catch(function () {});
    } else {
      $('bm').textContent = 'Downloading your app…';
      fetchApp('').then(function (r) { return kvSet('app', { v: r.v, html: r.html }).then(function () { mount(r.html); }); }).catch(showErr);
    }
  });
})();
</script>
</body></html>
